# News backtest: does overnight news predict the next trading day? (see backtest_news.py)
# Independent personal project, not tied to any employer or agency. Public market data and news, paper money only.
name: News Backtest
on:
  workflow_dispatch:
  pull_request:
    paths: [backtest_news.py, .github/workflows/backtest-news.yml]
    types: [opened, synchronize]
permissions:
  contents: write
concurrency:
  group: backtest-news-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Hand-checked unit tests
        run: python -m pytest -q tests/test_backtest_news.py tests/test_meta_filter.py
      - name: Run news backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        # 3 years: Oct 2023 - Oct 2026. The fixed rule is judged on Oct 2023 - Oct 2025 (never seen);
        # Oct 2025 - Oct 2026 is where the rule was found, reported separately.
        run: python backtest_news.py --days 1100 --split 2025-10-17 --out state/backtest_news_3y.json | tee state/backtest_news_3y.txt
      - name: Save results
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/backtest_news* || true
          git diff --cached --quiet && exit 0
          git commit -m "news backtest results [skip ci]"
          B="${{ github.head_ref || 'main' }}"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$B"; then git push origin HEAD:"$B" && exit 0
            else git rebase --abort 2>/dev/null || true; fi
            sleep $(( i * 5 ))
          done
          exit 1
