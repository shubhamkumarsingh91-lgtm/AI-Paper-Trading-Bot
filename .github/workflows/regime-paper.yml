# Timing: started by cron-job.org (New York time) via the "Run workflow" API.
# GitHub's own schedule was removed Oct 21, 2026: it fired late or not at all and caused double runs.
# Regime-Sideways paper trader - runs once a day ~15 min before the US close.
# DISCLAIMER: Independent personal project. Not tied to any employer or agency.
# Public data only. No internal or personal data (no SSNs / PHI). Paper trading only.
name: Regime-Sideways Paper Trader

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = show orders without placing them"
        default: "1"

permissions:
  contents: write

concurrency:
  group: regime-paper
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FIX (Oct 22, 2026): without this, a run that waited in the queue starts from the code as it was
          # when it was TRIGGERED, missing the commit the run ahead of it just pushed -> rebase clash.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q yfinance pandas requests
      - name: Run strategy
        env:
          REGIME_ALPACA_API_KEY: ${{ secrets.REGIME_ALPACA_API_KEY }}
          REGIME_ALPACA_SECRET_KEY: ${{ secrets.REGIME_ALPACA_SECRET_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python regime_paper.py
      - name: Save state
        run: |
          git config user.name "regime-bot"
          git config user.email "regime-bot@users.noreply.github.com"
          python events.py regime --bot b2 --dir state --out state/events_regime.json || echo 'events skipped'   # Agent HQ story feed
          git add state/ || true
          git commit -m "regime paper update [skip ci]" || exit 0
          # Several bots save to main within seconds of each other (e.g. 15:50 EOD). Each writes its own
          # files, so on a rejected push we just pull the other bot's commit and try again.
          for i in 1 2 3 4 5; do
            # Attempts 1-2: normal rebase. Attempt 3+: on a clash keep THIS run's lines (-X theirs means
            # "our commit" during a rebase), so one run's save is never thrown away like on Oct 22.
            X=""; [ $i -ge 3 ] && X="-X theirs"
            if git pull --rebase $X origin main; then git push origin HEAD:main && exit 0
            else git rebase --abort 2>/dev/null || true; fi
            echo "Push raced with another bot (attempt $i); retrying"
            sleep $(( i * 4 + RANDOM % 5 ))
          done
          echo "Could not push after 5 attempts"; exit 1
