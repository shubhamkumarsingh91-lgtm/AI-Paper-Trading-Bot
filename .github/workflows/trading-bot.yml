# Timing: started by cron-job.org (New York time) via the "Run workflow" API.
# GitHub's own schedule was removed Oct 21, 2026: it fired late or not at all and caused double runs.
# Independent personal project, not tied to any employer or agency.
# Paper trading only. Public market data only. No personal data (no SSNs/PHI).
#
# Put this file at: .github/workflows/trading-bot.yml
name: AI Paper Trading Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "premarket | scan | eod | retrain"
        default: "retrain"

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply bot updates (safe to repeat)
        run: python apply_updates.py
      - name: Pick mode
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "m=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          case "${{ github.event.schedule }}" in
            "30 12 * * 1-5") echo "m=premarket" >> $GITHUB_OUTPUT ;;
            "50 19 * * 1-5") echo "m=eod" >> $GITHUB_OUTPUT ;;
            "5 4 * * 2-6")   echo "m=retrain" >> $GITHUB_OUTPUT ;;
            *)               echo "m=scan" >> $GITHUB_OUTPUT ;;
          esac
      - name: Run bot
        env:
          STATE_DIR: state
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ai_trading_bot.py --mode ${{ steps.mode.outputs.m }}
      - name: Save learning back to repo
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ ai_trading_bot.py || true
          git diff --cached --quiet || git commit -m "bot state update [skip ci]"
          # Several bots save to main within seconds of each other (e.g. 15:50 EOD). Each writes its own
          # files, so on a rejected push we just pull the other bot's commit and try again.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push raced with another bot (attempt $i); retrying"
            sleep $(( i * 4 + RANDOM % 5 ))
          done
          echo "Could not push after 5 attempts"; exit 1
