name: 200-Day Strategy Backtest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - name: Run backtest
        run: python backtest_regime.py | tee backtest_output.txt
      - name: Save results to repo
        if: always()
        run: |
          mkdir -p state
          cp backtest_output.txt state/ || true
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || git commit -m "backtest results [skip ci]"
          git pull --rebase && git push
