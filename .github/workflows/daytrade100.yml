# Timing: started by cron-job.org (New York time) via the "Run workflow" API.
# GitHub's own schedule was removed Oct 21, 2026: it fired late or not at all and caused double runs.
# DISCLAIMER: Independent personal project. Not tied to any employer or agency.
# Paper trading only, public market data, no internal or personal data (no SSNs/PHI).
#
# Runs daytrade100.py (bot #3) on its own Alpaca paper account.
name: Day-Trade-100 Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "premarket, scan, eod, retrain or history"
        default: "scan"

concurrency:
  group: daytrade100             # one DT100 run at a time; saves to main retry on a race
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # FIX (Oct 22, 2026): without this, a run that waited in the queue starts from the code as it was
          # when it was TRIGGERED, missing the commit the run ahead of it just pushed -> rebase clash.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pick mode
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then M="${{ github.event.inputs.mode }}"
          else case "${{ github.event.schedule }}" in
            "30 12 * * 1-5") M=premarket ;;
            "50 19 * * 1-5") M=eod ;;
            "20 4 * * 2-6")  M=retrain ;;
            *)               M=scan ;;
          esac; fi
          echo "mode=$M" >> $GITHUB_OUTPUT

      - name: Run bot
        env:
          DAYTRADE100_ALPACA_API_KEY: ${{ secrets.DAYTRADE100_ALPACA_API_KEY }}
          DAYTRADE100_ALPACA_SECRET_KEY: ${{ secrets.DAYTRADE100_ALPACA_SECRET_KEY }}
        run: python daytrade100.py --mode ${{ steps.mode.outputs.mode }}

      - name: Save memory back to repo
        if: always()
        run: |
          git config user.name "daytrade100-bot"
          git config user.email "actions@github.com"
          python backfill_precision.py state_dt100 || echo 'backfill skipped'   # precision history for the dashboard
          python events.py day --bot b3 --dir state_dt100 --out state_dt100/events.json || echo 'events skipped'   # Agent HQ story feed
          git add state_dt100/ || true
          git diff --cached --quiet || git commit -m "dt100 state [skip ci]"
          # Several bots save to main within seconds of each other (e.g. 15:50 EOD). Each writes its own
          # files, so on a rejected push we just pull the other bot's commit and try again.
          for i in 1 2 3 4 5; do
            # Attempts 1-2: normal rebase. Attempt 3+: on a clash keep THIS run's lines (-X theirs means
            # "our commit" during a rebase), so one run's save is never thrown away like on Oct 22.
            X=""; [ $i -ge 3 ] && X="-X theirs"
            if git pull --rebase $X origin main; then git push origin HEAD:main && exit 0
            else git rebase --abort 2>/dev/null || true; fi
            echo "Push raced with another bot (attempt $i); retrying"
            sleep $(( i * 4 + RANDOM % 5 ))
          done
          echo "Could not push after 5 attempts"; exit 1
